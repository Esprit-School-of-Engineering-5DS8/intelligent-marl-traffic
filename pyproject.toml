[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cotraffic"
version = "0.1.0"
description = "Cooperative multi-agent reinforcement learning for urban traffic signal control with SUMO"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
cotraffic = "cotraffic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "sumo_files", "results", "figures", "notebooks",
    # verbatim copies of the teammate's LLM team, kept byte-identical for their
    # provenance (src/cotraffic/controllers/llm_team/PROVENANCE.md)
    "src/cotraffic/controllers/llm_team", "src/cotraffic/envs/ev.py", "tests/test_llm_team_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["cotraffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "sumo: starts a SUMO simulation (slower, needs SUMO installed)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pygame.*",
]
