name: checks

on:
  push:
    branches: [main, integration]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The full requirements.txt pulls SUMO, torch and stable-baselines3, which are
      # heavy and unnecessary for the API contract and domain tests. The test suite is
      # designed to run without a live SUMO binary, so install only what it imports.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff httpx fastapi pydantic pyyaml numpy pandas
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
