name: sensitivity
description: >
  Design checks outside the main comparison: the forecast observation block (RQ6, Tier 3;
  compared with COOP in core.yaml) and the weight of the emergency-vehicle reward term
  (lambda_ev = 1 and 4, one training seed each; COOP-FULL uses lambda_ev = 2). The CO2
  weight is checked by COOP-ECO lambda 0.5 vs 1.0 in core.yaml.
seeds: [0, 1, 2, 3, 4]
cells:
  - network: grid4x4
    methods: [coop_forecast]
    demands: [medium, peak, rush_profile]
    scenarios: [normal]
    ssm: false
  - network: grid4x4
    methods: [coop_full_ev1, coop_full_ev4]
    demands: [peak]
    scenarios: [emergency]
    ssm: false
