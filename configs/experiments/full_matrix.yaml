name: full_matrix
description: >
  Every result of the report. Learned variants are evaluated with each of their selected
  checkpoints (one per training seed) on the 5 evaluation seeds. Safety measures (SSM)
  are computed where safety is compared (normal and incident scenarios) to keep the
  cost of the matrix affordable on a laptop.
seeds: [0, 1, 2, 3, 4]
cells:
  # RQ1 - main comparison, all demand levels
  - network: grid4x4
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [low, medium, peak, rush_profile]
    scenarios: [normal]
  # RQ3 - travel time vs CO2 (Pareto front)
  - network: grid4x4
    methods: [coop_eco05, coop_eco]
    demands: [medium, peak]
    scenarios: [normal]
  # RQ4 - incident
  - network: grid4x4
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [medium, peak]
    scenarios: [incident]
  # RQ2 - emergency vehicles
  - network: grid4x4
    methods: [ft, act, mp, ev_rule, coop, coop_full]
    demands: [medium, peak]
    scenarios: [emergency]
    ssm: false
  # people: pedestrians and buses
  - network: grid4x4
    methods: [ft, act, mp, coop, coop_full]
    demands: [medium, peak]
    scenarios: [pedestrians, buses]
    ssm: false
  # RQ4 - sensor faults and communication failures
  - network: grid4x4
    methods: [mp, ind, coop]
    demands: [peak]
    scenarios: [sensor_noise]
    ssm: false
  - network: grid4x4
    methods: [coop]
    demands: [peak]
    scenarios: [comm_dropout_10, comm_dropout_30, comm_dropout_50]
    ssm: false
  # RQ5 - zero-shot scalability (policies trained on grid4x4)
  - network: grid8x8
    checkpoint_network: grid4x4
    methods: [ft, mp, ind, coop]
    demands: [medium, peak]
    scenarios: [normal]
    ssm: false
  # real district
  - network: real_district
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [low, medium, peak, rush_profile]
    scenarios: [normal]
  - network: real_district
    methods: [ft, act, mp, ev_rule, coop, coop_full]
    demands: [peak]
    scenarios: [emergency]
    ssm: false
  - network: real_district
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [peak]
    scenarios: [incident]
