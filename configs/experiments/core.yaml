name: core
description: >
  The cells that answer RQ1-RQ5 at the most informative demand levels; run on the team
  laptop. `extended.yaml` holds the rest of the full design (`full_matrix.yaml` = both).
  Run ids are shared, so a run done by one experiment is never repeated by another.
seeds: [0, 1, 2, 3, 4]
cells:
  # RQ1 - main comparison (SSM on: safety compared on the normal scenario)
  - network: grid4x4
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [low, medium, peak, rush_profile]
    scenarios: [normal]
  # RQ3 - travel time vs CO2
  - network: grid4x4
    methods: [coop_eco05, coop_eco]
    demands: [medium, peak]
    scenarios: [normal]
    ssm: false          # the Pareto front needs travel time and CO2 only
  # RQ2 - emergency vehicles
  - network: grid4x4
    methods: [ft, act, mp, ev_rule, coop, coop_full]
    demands: [peak]
    scenarios: [emergency]
    ssm: false
  # RQ4 - incident, sensor faults, communication failures
  - network: grid4x4
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [peak]
    scenarios: [incident]
    ssm: false
  - network: grid4x4
    methods: [mp, ind, coop]
    demands: [peak]
    scenarios: [sensor_noise]
    ssm: false
  - network: grid4x4
    methods: [coop]
    demands: [peak]
    scenarios: [comm_dropout_10, comm_dropout_30, comm_dropout_50]
    ssm: false
  # people
  - network: grid4x4
    methods: [ft, act, mp, coop, coop_full]
    demands: [medium]
    scenarios: [pedestrians, buses]
    ssm: false
  # RQ5 - zero-shot scalability
  - network: grid8x8
    checkpoint_network: grid4x4
    methods: [ft, mp, ind, coop]
    demands: [peak]
    scenarios: [normal]
    ssm: false
  # real district
  - network: real_district
    methods: [ft, act, mp, ind, coop, coop_full]
    demands: [medium, peak]
    scenarios: [normal]
  - network: real_district
    methods: [ft, act, mp, ev_rule, coop, coop_full]
    demands: [peak]
    scenarios: [emergency]
    ssm: false
