name: extra
description: >
  Cells re-run with the dashboard's extra measurements (pedestrian P95, crossings completed
  in green, pedestrian greens and crowd size, emergency-vehicle log with stops at red and
  arrival-time error, reward terms): `evaluate --experiment extra --extra`. Results go to
  results/extra/; the report's results in results/raw/ are not touched. Same seeds as the
  original runs, whose common metrics they must reproduce.
seeds: [0, 1, 2, 3, 4]
cells:
  - network: grid3x3
    methods: [ft, act, mp, ped_rule_mp, coop, coop_full]
    demands: [medium, peak]
    scenarios: [pedestrians]
    ssm: false
  - network: grid3x3
    methods: [ft, act, mp, ev_rule, ev_rule_mp, coop, coop_full]
    demands: [medium, peak]
    scenarios: [emergency]
    ssm: false
  - network: tunis
    methods: [ft, act, mp, ev_rule, ev_rule_mp, coop, coop_full]
    demands: [peak]
    scenarios: [emergency]
    ssm: false
  - network: grid3x3
    methods: [ft, act, mp, ind, coop, coop_full, dqn]
    demands: [peak]
    scenarios: [normal]
    ssm: false
