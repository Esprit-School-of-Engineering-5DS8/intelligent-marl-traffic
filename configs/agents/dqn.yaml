name: dqn
extends: base
description: >
  Independent agents (IND's local observation and reward) learned with DQN instead of PPO,
  to compare the learning algorithm alone. Hyperparameters fixed before any run, not tuned:
  replay buffer of 100 000 agent steps, epsilon-greedy exploration falling from 1 to 0.05
  over the first 20 % of training, target network replaced every 10 000 agent steps, one
  gradient step per transition collected (all intersections share the network, as with PPO).
algorithm: dqn
dqn:
  learning_rate: 5.0e-4
  buffer_size: 100000
  learning_starts: 5000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 1
  gradient_steps: -1
  target_update_interval: 10000
  exploration_fraction: 0.2
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  net_arch: [64, 64]
