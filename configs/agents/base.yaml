# Shared by every learned variant; a variant file overrides what it changes (key `extends`).
name: base

observation:
  neighbours: false
  emergency: false
  pedestrians: false
  buses: false
  forecast: false

reward:
  person_weighted: false
  co2: 0.0
  ev: 0.0
  ped: 0.0
  clip: 5.0

# Stable-Baselines3 PPO defaults, except n_steps: every intersection is one environment
# slot, so 256 steps x 16 agents = 4 096 samples per update on grid3x3 (the default 2 048
# would give 32 768 samples and only a handful of updates in our budget).
ppo:
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]

training:
  total_timesteps: 500000     # agent steps (one decision of one intersection = 1 step)
  checkpoint_every: 50000     # agent steps
  progress_every_s: 15        # console + progress.log update interval
  demand_levels: [low, medium, peak, rush_profile]
  scenarios: []
  quick_timesteps: 3000

validation:                   # checkpoint selection, never on evaluation seeds
  seeds: [1000]
  demands: [medium, peak]
  last_checkpoints: 4
