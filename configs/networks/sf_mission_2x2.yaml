# San Francisco Mission-district 2x2 — real SoMa arterials, built from OSM.
#
# Four signalised crossings (the whole SoMa grid is diagonal):
#   Mission x 6th, Mission x 7th, Howard x 6th, Howard x 7th
#
# Built by `python -m cotraffic networks sf_mission_2x2 --force`, reusing the
# generous extract of sf_mission_3x3 (extract_from).

name: sf_mission_2x2
kind: osm
description: >
  San Francisco SoMa 2x2: Mission/Howard between 6th and 7th. The four target
  arterials of the extract are kept and clipped to the corridor.

osm:
  bbox: [-122.4150, 37.7720, -122.4040, 37.7815]   # matches the 3x3 supply extract
  extract_from: sf_mission_3x3   # same saved extract, corridor differs
  road_types:
    - primary
    - primary_link
    - secondary
    - secondary_link
  keep_names:
    - Mission Street
    - Howard Street
    - 6th Street
    - 7th Street
  corridor_crossings:    # lon/lat of the four target junctions (OSM shared nodes)
    - [-122.4087, 37.7810] # Mission x 6th
    - [-122.4109, 37.7792] # Mission x 7th
    - [-122.4072, 37.7797] # Howard x 6th
    - [-122.4094, 37.7780] # Howard x 7th
  corridor_margin_lon: 0.0006
  corridor_margin_lat: 0.0009
  join_dist_m: 15
  signal_dist_m: 25
  tls_join_dist_m: 30
  guess_tls: false
  tls_set: []
  tls_unset: []

pedestrians: true

padding:
  lanes_per_side: 4
  max_phases: 8
  max_crossings: 8
  extra_crossings_unobserved: true

neighbours:
  max_distance_m: 400

demand:
  # placeholder until `cotraffic calibrate-demand --net sf_mission_2x2` runs
  peak_vehicles_per_hour: 2600
  origin_side_weights: {west: 1.0, east: 1.0, north: 1.0, south: 1.0}
  opposite_side_prob: 0.5
  route_random_factor: 1.2
