# Tunis — real-world OSM network, central Tunis (whole city, not just the Bourguiba corridor)
#
# Built automatically by `python -m cotraffic networks tunis --force`
# This is the canonical "Phase 2 real-world" network for the project.
# Central Tunis: the lake edge and the port in the north, El Menzah in the east,
# Bab Saadoun / El Omaria in the west — roughly 5.2 km × 4.3 km with real
# signalised junctions.
#
# To change area: edit osm.bbox (and tls_set/tls_unset), delete
# sumo_files/tunis/ and run `python -m cotraffic networks tunis --force`.

name: tunis
kind: osm
description: >
  Central Tunis – city-scale network from the Tunisian lake through the medina
  and Avenue Habib Bourguiba to El Menzah. Built from OpenStreetMap via
  Overpass API + netconvert, covering the full street grid inside the bbox
  (arterials, avenues, secondary and residential streets).

osm:
  # The corridor OpenStreetMap extract is saved next to the network (tunis.osm.xml),
  # so `cotraffic networks tunis --force` rebuilds offline instead of
  # downloading Grand Tunis again.
  bbox: [10.160, 36.785, 10.215, 36.828]   # [west, south, east, north], WGS84
  # The whole drivable street grid inside the bbox. Dropping residential streets
  # left only the arterials, so every car was forced onto them and the corridor
  # jammed while the parallel streets stayed empty. Service ways are still
  # excluded: they are driveways, parking aisles and yard access, not through
  # traffic.
  road_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link
    - tertiary
    - tertiary_link
    - residential
    - unclassified
    - living_street
  # netconvert only guesses sidewalks/crossings on edges at or below this speed.
  # The arterial build has a median lane speed of 100 km/h (max 142), so the default
  # 50 km/h threshold left 1 229 of 1 266 lanes without a footway; this covers the net.
  sidewalks_max_speed_kmh: 145
  join_dist_m: 15          # junction clusters closer than this become one junction
  signal_dist_m: 25        # OSM signal nodes this close to a junction → signalised
  tls_join_dist_m: 30      # signals this close are controlled together
  guess_tls: false
  # OpenStreetMap tags very few signals in Tunis (72 nodes city-wide in Sept 2026;
  # 3 usable junctions here). We also signalise the key intersections where the two
  # main avenues meet (OSM node ids below). Verify these on-site (Empathize stage).
  # The full-grid rebuild no longer joins 1089663256 and 4940244077 into one
  # cluster, so both junctions are listed and tls.join merges them if they are close.
  tls_set: [287863988, 387151797, 5294059357, 1089663256, 4940244077, 1089666873]
  tls_unset: []

pedestrians: true
# Only 4 of the ~112 imported arterial edges carry an OSM sidewalk tag, so the
# footways are guessed (see osm.sidewalks_max_speed_kmh): the rebuild gives every
# arterial edge a sidewalk and its junctions a crossing, which is what pedestrian
# scenarios need. Verified with `episode --net tunis --scenarios pedestrians`.

padding:
  # City-scale rebuild: the biggest signalised junction runs 6 phases, so 8 keeps a margin
  # (observations are rejected when a junction exceeds the padding, see Monaco).
  lanes_per_side: 4
  max_phases: 8
  max_crossings: 8
  extra_crossings_unobserved: true

neighbours:
  max_distance_m: 500

demand:
  # The corridor net (1.4 × 1.3 km, ~112 arterial edges) was calibrated at 5200 veh/h.
  # The city-scale net (~6x the edges and 13 signalised junctions) takes the rate up
  # proportionally; re-calibrate with `cotraffic calibrate-demand --net tunis` before
  # drawing study conclusions at this size.
  peak_vehicles_per_hour: 13000
  # Live window: just above the calibrated peak, so a 10-minute run fills the
  # 5.2 x 4.3 km net instead of trickling onto it. Benchmarks keep 13000.
  live_vehicles_per_hour: 14000
  # Central Tunis is foot-traffic heavy (medina, Avenue Bourguiba).
  pedestrians_per_hour: 3200
  origin_side_weights: {west: 1.0, east: 1.0, north: 1.0, south: 1.0}
  opposite_side_prob: 0.5
  route_random_factor: 1.3

# Avenue Mohamed V / Avenue Habib Bourguiba through the signalised junctions
# (577010716 was absorbed by the junction joining in the city-scale rebuild;
# 1431945574#0 starts at the junction downstream of 10641416#0 and reaches the
# old terminus 94346392#5.)
bus_lines:
  - id: L1
    from_edge: "247165438#0"
    to_edge: "10641416#0"
    reverse_from_edge: "1431945574#0"
    reverse_to_edge: "94346392#0"

incident:
  edge: "94346392#0"      # northbound Avenue Mohamed V, 560 m, 2 vehicle lanes
  lane: 1                 # rightmost vehicle lane (lane 0 is the sidewalk)
  position_frac: 0.85     # stopped vehicle just before the stop line
