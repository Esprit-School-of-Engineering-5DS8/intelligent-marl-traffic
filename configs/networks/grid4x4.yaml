name: grid4x4
kind: grid
description: 4x4 grid of signalised 4-way intersections, 2 lanes per approach, 250 m links.

grid:
  x: 4
  y: 4
  length: 250          # m between intersections
  attach_length: 250   # m of the entry/exit links on the fringe
  lanes: 2             # vehicle lanes per approach
  speed: 13.89         # m/s (50 km/h)

# Sidewalks and crossings are always built so that every scenario runs on the same
# network; pedestrians only appear in scenarios that generate them.
pedestrians: true

# Observation/action padding. grid8x8 uses the same values so that a policy trained
# here can be evaluated there without retraining.
padding:
  lanes_per_side: 2
  max_phases: 2
  max_crossings: 4

neighbours:
  max_distance_m: 400

demand:
  peak_vehicles_per_hour: 2600   # calibrated, see docs/EXPERIMENT_JOURNAL.md (M1)
  # Dominant west->east commuter flow so that adaptivity matters.
  origin_side_weights: {west: 1.6, east: 0.8, north: 1.0, south: 0.6}
  opposite_side_prob: 0.6        # probability that a trip ends on the side facing its origin
  route_random_factor: 1.5       # duarouter edge-weight noise, spreads trips over parallel routes

bus_lines:
  - {id: L1, from_side: west, from_index: 1, to_side: east, to_index: 1}
  - {id: L2, from_side: south, from_index: 2, to_side: north, to_index: 2}

incident:
  edge: B1C1          # eastbound approach of the central junction C1 (dominant direction)
  lane: 1             # rightmost vehicle lane (lane 0 is the sidewalk)
  position_frac: 0.4  # stopped vehicle at 40% of the link, leaves room to merge back

reward_norm:          # set by `cotraffic calibrate` from baseline runs
  wait: 1.0
  co2: 1.0
  ev: 1.0
  ped: 1.0
