# Monaco — the MoSTScenario network (Monaco SUMO Traffic scenario).
#
# Upstream: https://github.com/lcodeca/MoSTScenario  (GPLv3)
#   L. Codeca, J. Härri, "Monaco SUMO Traffic (MoST) Scenario: A 3D Mobility
#   Scenario for Cooperative ITS", SUMO User Conference 2018.
#
# Why this net and not our own OSM build: the scenario is a validated,
# community-maintained road layout of the whole principality (3523 junctions,
# 18837 edges, 12 signalised intersections, pedestrian areas, bus and train
# stops), whereas `build_osm` produced an arterial-only approximation whose
# geometry and signal placement were guesses.
#
# The .net.xml is 14 MB, so it is not committed (`sumo_files/` is gitignored).
# Fetch it once and rebuild:
#
#   git clone --depth 1 https://github.com/lcodeca/MoSTScenario sumo_files/_most
#   python -m cotraffic networks monaco --force
#
# `networks monaco` copies scenario/in/most.net.xml to
# sumo_files/monaco/monaco.net.xml. Delete sumo_files/_most afterwards if you
# don't need the upstream routes (they are not used: demand is generated by
# cotraffic.demand so every controller sees the same vehicles).

name: monaco
kind: prebuilt
description: >
  Principality of Monaco, full MoSTScenario road network from Port Hercule to
  Monte-Carlo. Vendored net, not built from OSM. Rebuild with
  `python -m cotraffic networks monaco --force` after cloning MoSTScenario
  into sumo_files/_most.

prebuilt:
  source: "https://github.com/lcodeca/MoSTScenario"
  checkout: "sumo_files/_most"
  net: "scenario/in/most.net.xml"
  license: "GPLv3 — Codeca & Härri, MoSTScenario"

# Kept for the live map projection (api/simulation.py draws the network extent
# inside this box) and for the demand generator's side weights.
osm:
  bbox: [7.4080, 43.7200, 7.4610, 43.7530]  # Full territory of Monaco, WGS84

pedestrians: true
# MoST ships pedestrian areas and crossings, so pedestrian scenarios work here.

# Fixed-shape observation padding (src/cotraffic/envs/traffic_env.py). Measured on the
# MoST net: 12 signalised junctions, 6–10 phases each, no crossing elements on the TLS
# nodes. max_phases must stay above 10 or every observation is rejected.
padding:
  lanes_per_side: 4
  max_phases: 12
  max_crossings: 8
  extra_crossings_unobserved: true

neighbours:
  max_distance_m: 400      # smaller city — neighbours are closer

demand:
  # Calibrated against MoSTScenario's own demand (scenario/in/route/*.xml), 08:00 peak hour:
  #   648 commercial + 303 special + 240 highway + 96 buses = 1287 veh/h motorised arrivals.
  # The earlier 3800 was a placeholder ~3x above that and beyond the network's capacity:
  # under fixed-time control it reached only 1446 veh/h of throughput with the queue growing
  # all episode (mean queue 76 veh).
  #
  # `cotraffic calibrate-demand --net monaco` (seed 5001, fixed-time, stored in
  # results/calibration/monaco_demand_sweep.csv):
  #   996 veh/h  -> waiting  9.0 s, p95  37 s, queue  2.3, throughput 1005, 0 teleports
  #  1303 veh/h  -> waiting 15.0 s, p95  68 s, queue  6.3, throughput 1308, 0 teleports
  #  1523 veh/h  -> waiting 24.8 s, p95 111 s, queue 11.5, throughput 1513, 0 teleports
  # 1300 matches the scenario's own peak rate and sits at the "clear congestion without
  # permanent gridlock" point, so peak is the MoST rush hour (medium 910, low 585).
  peak_vehicles_per_hour: 1300
  origin_side_weights: {west: 1.0, east: 1.0, north: 0.5, south: 1.5}
  opposite_side_prob: 0.55
  route_random_factor: 1.2

# Incident placement is left empty: MoST edge ids change with every upstream
# release. Pick one from the current net before enabling the incident scenario:
#   grep -o 'id="[^"]*"' sumo_files/monaco/monaco.net.xml | head
# incident:
#   edge: "<edge id>"
#   lane: 0
#   position_frac: 0.75
